[project]
name = "agentic-assistant-mlops"
version = "1.0.0"
description = "Track B: MLOps (uv, MLflow, Evidently) for the W15 assistant + W16 verification agent"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mlflow>=3.1,<4",
    "evidently>=0.7.14,<0.8",
    "openai>=1.60,<3.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "httpx>=0.28,<1.0",
    "pandas>=2.2",
    "tabulate>=0.10.0",
]

[project.optional-dependencies]
airflow = ["apache-airflow>=2.9,<2.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "agentic_mlops"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
