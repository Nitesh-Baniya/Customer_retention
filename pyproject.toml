[project]
name = "retention-analytics"
version = "1.0.0"
description = "Customer Retention Analytics Platform with production MLOps pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "mlflow>=2.14,<3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "evidently>=0.4.40",
    "pydantic>=2.7",
]

[project.optional-dependencies]
airflow = [
    "apache-airflow>=2.9,<2.11",
]

[project.scripts]
retention-train = "retention.training:main"
retention-monitor = "retention.monitoring:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retention"]

[tool.uv]
package = true
